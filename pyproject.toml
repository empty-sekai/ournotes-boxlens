[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ournotes-boxlens"
version = "0.2.0"
description = "CPU screenshot importer for BanG Dream! Our Notes player collections"
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3",
  "Pillow>=11,<13",
  "opencv-python-headless>=4.10,<6",
  "onnxruntime>=1.20,<2",
]

[project.optional-dependencies]
test = ["jsonschema>=4.18,<5", "pytest>=8,<10"]

[project.scripts]
ournotes-boxlens = "bdon_vision.cli:main"

[tool.setuptools]
packages = ["bdon_vision", "bdon_vision.deck"]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
include-package-data = false

[tool.setuptools.package-data]
bdon_vision = ["web.html", "web.js"]
"bdon_vision.deck" = ["web.html"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", "*.pyo"]
