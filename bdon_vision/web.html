<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Notes BoxLens</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#202038;background:#f4f3f8}*{box-sizing:border-box}body{margin:0}main{max-width:1160px;margin:auto;padding:36px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:24px}h1{font-size:30px;margin:0 0 8px;letter-spacing:-1px}p{color:#696979;line-height:1.7}button,.pick{border:0;background:#5550bd;color:white;padding:12px 20px;border-radius:10px;cursor:pointer;font-size:15px}button:disabled{opacity:.4;cursor:wait}.secondary{background:white;color:#5550bd;border:1px solid #dcdaec}.drop{background:white;border:2px dashed #cfcbdf;border-radius:16px;text-align:center;padding:32px;margin:28px 0 16px}.drop.over{border-color:#5550bd;background:#f0efff}.drop h2{font-size:20px;margin:0 0 12px}.drop p{margin:12px 0 0;font-size:14px}#files{margin:12px;color:#57536e}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.stats{display:flex;gap:14px;margin:24px 0}.stat{flex:1;background:white;border-radius:12px;padding:16px}.stat b{display:block;font-size:26px}.stat span{font-size:13px;color:#77758b}.notice{padding:14px 18px;background:#eceaf8;border-radius:10px;line-height:1.6;font-size:14px}#status{margin:16px 0;min-height:24px}table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden}th,td{padding:12px 16px;text-align:left;border-bottom:1px solid #eeedf4}th{font-size:13px;color:#77758b;font-weight:500}td img{width:60px;height:70px;object-fit:contain;background:#f5f3fa;border-radius:4px}.identity{display:flex;align-items:center;gap:14px}.identity small{display:block;color:#878398;margin-top:5px}input[type=number]{width:78px;padding:9px;border:1px solid #dad7e7;border-radius:7px;font-size:15px}.unknown{background:#fff6e5;border-color:#e7c475!important}.badge{display:inline-block;padding:4px 8px;font-size:12px;border-radius:5px;background:#eaf4ef;color:#367453}.warn{background:#fff1db;color:#96631c}.source{font-size:12px;color:#8b879b;max-width:190px;overflow-wrap:anywhere}.empty{text-align:center;padding:45px;color:#888}footer{color:#8a879c;font-size:12px;margin:22px 0}@media(max-width:700px){main{padding:24px 12px}header{align-items:flex-start}h1{font-size:25px}.stats{gap:6px}.stat{padding:12px}th,td{padding:10px 8px}.source{display:none}.identity img{width:40px;height:55px}.identity{gap:8px}input[type=number]{width:60px}}
dialog{max-width:90vw;width:900px;border:1px solid #d5d0e9;border-radius:14px;padding:20px}dialog::backdrop{background:#1c1939a8}#preview-body canvas{max-width:100%;height:auto;background:#eee}#preview-body{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}#preview-body figure{margin:16px 0}dialog{max-height:90vh}dialog .toolbar{position:sticky;top:0;background:white;padding-bottom:12px;z-index:1}.inspect{background:none;border:0;padding:0;cursor:pointer}.conflict{font-size:12px;color:#946016;max-width:150px;margin-top:6px}.table-scroll{overflow:auto}</style><main><header><div><h1>Our Notes BoxLens</h1><p style="margin:0">上传成员与 Snap 列表截图，合并为你的卡片收藏。</p></div><span class="badge">本地 CPU 识别</span></header>
<section class="drop" id="drop"><h2>拖入截图，或选择图片</h2><label class="pick" for="upload">选择截图</label><input id="upload" type="file" multiple accept="image/*" hidden><p>请使用清晰的成员或 Snap 列表截图，支持多张、重叠截图。将底部渐隐或被遮挡的卡片滚动到画面中央后重新截图；识别结果可手工校对。</p><div id="files"></div></section>
<div class="toolbar"><button id="scan" disabled>识别并合并</button><button id="export" class="secondary" disabled>导出 Box JSON</button><button id="reset" class="secondary">清空</button></div><div id="status" role="status"></div>
<div class="notice">结果仅代表截图中识别到的卡片。未出现的卡片不会被判定为未拥有；普通等级列表未显示的培养次数保留为未知。请将不同玩家的截图分批导入。</div>
<section class="stats"><div class="stat"><b id="members">0</b><span>成员</span></div><div class="stat"><b id="snaps">0</b><span>Snap</span></div><div class="stat"><b id="duplicates">0</b><span>重复观察已合并</span></div><div class="stat"><b id="review">0</b><span>待补充 / 确认</span></div></section>
<div class="table-scroll"><table><thead><tr><th>卡片</th><th>等级</th><th>卡阶</th><th>特训</th><th>状态</th><th class="source">截图来源</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">识别结果会显示在这里</td></tr></tbody></table></div><footer>图片仅在当前识别服务处理，不会写入训练集。导出包含截图来源和冲突信息。</footer></main><dialog id="preview"><div class="toolbar"><strong id="preview-title"></strong><button id="close-preview" class="secondary">关闭</button></div><div id="preview-body"></div></dialog>
<script src="/app.js"></script></html>
